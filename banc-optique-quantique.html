<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banc d'optique quantique</title>
<style>
:root{--bg:#0a0d13;--panel:#121722;--panel2:#171e2c;--line:#243047;--txt:#dce6f5;--mut:#8796ad;--acc:#7aa8ff;--q:#c38bff;--ok:#7cf29a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:210px 1fr 300px;grid-template-rows:46px 1fr 270px;height:100vh}
header{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;overflow-x:auto}
header h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap;font-weight:650;letter-spacing:.2px}
header h1 span{color:var(--q)}
.lang{display:flex;flex:none}.lang button{padding:4px 9px;border-radius:0}.lang button:first-child{border-radius:6px 0 0 6px}.lang button:last-child{border-radius:0 6px 6px 0;border-left:none}
button,select,input{font:inherit;color:var(--txt)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)}
button.on{background:#233a66;border-color:var(--acc)}
button.q{border-color:#5b3d86}
button.q:hover{border-color:var(--q)}
select,input[type=number],input[type=text]{background:#0e131d;border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.sep{width:1px;height:24px;background:var(--line);flex:none}
#palette{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:6px 8px 20px}
#palette h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:12px 2px 5px;font-weight:600}
.pitem{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:grab;user-select:none;border:1px solid transparent}
.pitem:hover{background:var(--panel2);border-color:var(--line)}
.pitem canvas{flex:none}
#stage{position:relative;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:10px;top:6px;color:var(--mut);font-size:11.5px;pointer-events:none;text-shadow:0 0 4px #000}
#warn{position:absolute;right:10px;top:8px;color:#ffb35c;font-size:12px;display:none}
#props{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:10px 12px 20px}
#props h2{font-size:14px;margin:2px 0 8px}
.row{margin:8px 0}
.row label{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-bottom:3px}
.row label b{color:var(--txt);font-weight:600}
.row input[type=range]{width:100%;accent-color:var(--acc)}
.row input[type=number],.row input[type=text],.row select{width:100%}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid3 input{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.desc{color:var(--mut);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:10px 0}
.desc b{color:var(--txt)}
#bottom{grid-column:1/4;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#qbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#qbar .stat{color:var(--mut);font-size:12px}
#qbar .stat b{color:var(--txt)}
#cards{display:flex;gap:10px;padding:10px;overflow-x:auto;overflow-y:hidden;flex:1;min-height:0}
.card{flex:none;width:250px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;cursor:pointer}
.card.sel{border-color:var(--acc)}
.card.wide{width:380px}
.card .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.card .t b{font-size:13px}
.card .t span{color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .val{font-size:12.5px;margin:3px 0;min-height:34px;font-variant-numeric:tabular-nums}
.card canvas{width:100%;flex:1;min-height:0;border-radius:6px;background:#0b0f17}
.empty{color:var(--mut);padding:10px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10}
.modal.show{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:760px;width:92vw;max-height:86vh;overflow:auto;padding:16px 20px}
.modal h2{margin:0 0 8px;font-size:17px}
.modal h3{margin:14px 0 4px;font-size:14px;color:var(--acc)}
.modal p,.modal li{color:#c3cfe2}
.modal table{border-collapse:collapse;font-size:12.5px}
.modal td,.modal th{border:1px solid var(--line);padding:3px 8px;text-align:left}
.modal textarea{width:100%;height:280px;background:#0e131d;color:var(--txt);border:1px solid var(--line);border-radius:6px;font:12px ui-monospace,monospace}
kbd{background:#0e131d;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
@media (max-width:900px){#app{grid-template-columns:150px 1fr 240px;grid-template-rows:46px 1fr 220px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="hTitle">Banc d'optique <span>quantique</span></h1>
    <div class="lang"><button id="lFR" class="on">FR</button><button id="lEN">EN</button></div>
    <select id="preset" title="Charger une expérience"><option value="">📚 Expériences…</option></select>
    <button id="bNew" title="Vider la table">Nouveau</button>
    <button id="bUndo" title="Annuler (Ctrl+Z)">↶ Annuler</button>
    <div class="sep"></div>
    <button id="bSnap" class="on" title="Aimanter à la grille (positions 5 mm, angles 5°)">Aimant</button>
    <button id="bRays" class="on" title="Afficher les faisceaux">Rayons</button>
    <button id="bFit" title="Recentrer la vue">⤢ Vue</button>
    <div class="sep"></div>
    <button id="bExport">Exporter</button>
    <button id="bImport">Importer</button>
    <button id="bHelp">? Aide</button>
  </header>
  <aside id="palette"></aside>
  <main id="stage"><canvas id="cv"></canvas><div id="hud"></div><div id="warn"></div></main>
  <aside id="props"></aside>
  <section id="bottom">
    <div id="qbar"></div>
    <div id="cards"></div>
  </section>
</div>
<div class="modal" id="mHelp"><div class="box" id="helpBox"></div></div>
<div class="modal" id="mIO"><div class="box">
  <h2 id="ioTitle">Exporter</h2>
  <p id="ioHint" style="margin:0 0 8px"></p>
  <textarea id="ioText" spellcheck="false"></textarea>
  <div class="btns"><button id="ioCopy">Copier</button><label class="btn"><input type="file" id="ioFile" accept=".json,application/json" style="display:none"><button id="ioFileBtn" type="button">Ouvrir un fichier…</button></label><button id="ioLoad">Charger ce montage</button><button id="ioClose">Fermer</button></div>
</div></div>
<script>
// ===================== MOTEUR PHYSIQUE =====================
// Unités : longueurs en mm, longueurs d'onde en nm, angles en degrés (UI).
// Polarisation (Jones) : composante 0 = H (dans le plan de la table, "p"), composante 1 = V (perpendiculaire, "s").
// Convention de phase : e^{+ik·L}. Faisceaux gaussiens : paramètre complexe q (1/q = 1/R + iλ/(πw²)).
const D2R = Math.PI / 180;
const C = (r, i = 0) => [r, i];
const cadd = (a, b) => [a[0] + b[0], a[1] + b[1]];
const cmul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
const csc = (a, s) => [a[0] * s, a[1] * s];
const cexp = p => [Math.cos(p), Math.sin(p)];
const cconj = a => [a[0], -a[1]];
const ca2 = a => a[0] * a[0] + a[1] * a[1];
const cinv = a => { const d = ca2(a); return [a[0] / d, -a[1] / d]; };
const J = {
  mul(M, E) { return [cadd(cmul(M[0][0], E[0]), cmul(M[0][1], E[1])), cadd(cmul(M[1][0], E[0]), cmul(M[1][1], E[1]))]; },
  sc(E, c) { return [cmul(E[0], c), cmul(E[1], c)]; },
  sr(E, s) { return [csc(E[0], s), csc(E[1], s)]; },
  n2(E) { return ca2(E[0]) + ca2(E[1]); },
};
function mm2(A, B) {
  const r = [[0, 0], [0, 0]];
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) r[i][j] = cadd(cmul(A[i][0], B[0][j]), cmul(A[i][1], B[1][j]));
  return r;
}
function rotM(t) { const c = Math.cos(t), s = Math.sin(t); return [[C(c), C(-s)], [C(s), C(c)]]; }
function retarderM(theta, delta) { return mm2(mm2(rotM(theta), [[C(1), C(0)], [C(0), cexp(delta)]]), rotM(-theta)); }
function polarizerM(theta) { const c = Math.cos(theta), s = Math.sin(theta); return [[C(c * c), C(c * s)], [C(c * s), C(s * s)]]; }

const v = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1]], sub: (a, b) => [a[0] - b[0], a[1] - b[1]],
  sc: (a, s) => [a[0] * s, a[1] * s], dot: (a, b) => a[0] * b[0] + a[1] * b[1],
  len: a => Math.hypot(a[0], a[1]), norm: a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; },
  neg: a => [-a[0], -a[1]],
};
const reflect = (d, n) => v.sub(d, v.sc(n, 2 * v.dot(d, n)));

const MATERIALS = {
  BK7: { name: 'Verre crown BK7', A: 1.5046, B: 4200 },
  F2: { name: 'Verre flint F2', A: 1.5939, B: 9000 },
  SF11: { name: 'Flint dense SF11', A: 1.7387, B: 15970 },
  SiO2: { name: 'Silice fondue', A: 1.4482, B: 3540 },
  H2O: { name: 'Eau', A: 1.3239, B: 3130 },
  diamant: { name: 'Diamant', A: 2.377, B: 13770 },
  custom: { name: 'Indice personnalisé', A: 1.5, B: 0 },
};
function matIndex(p, lam) {
  if (p.material === 'custom') return p.n || 1.5;
  const m = MATERIALS[p.material] || MATERIALS.BK7;
  return m.A + m.B / (lam * lam);
}

function polJones(pol, ang) {
  const r = Math.SQRT1_2;
  switch (pol) {
    case 'H': return [C(1), C(0)];
    case 'V': return [C(0), C(1)];
    case 'D': return [C(r), C(r)];
    case 'A': return [C(r), C(-r)];
    case 'R': return [C(r), C(0, r)];
    case 'L': return [C(r), C(0, -r)];
    default: { const a = (ang || 0) * D2R; return [C(Math.cos(a)), C(Math.sin(a))]; }
  }
}

// ---------- Définitions des composants ----------
const POL_OPTS = [['H', 'H (horizontale) |0⟩'], ['V', 'V (verticale) |1⟩'], ['D', 'D (+45°) |+⟩'], ['A', 'A (−45°) |−⟩'], ['R', 'R (circulaire droite) |+i⟩'], ['L', 'L (circulaire gauche) |−i⟩'], ['angle', 'Linéaire, angle libre'], ['U', 'Non polarisée (mélange)']];
const SPEC_OPTS = [['mono', 'Monochromatique'], ['rgb', 'RVB (3 raies)'], ['white', 'Blanche (continu, 13 raies)']];
const MAT_OPTS = Object.entries(MATERIALS).map(([k, m]) => [k, m.name]);
const P = {
  lambda: { label: 'Longueur d\'onde λ', type: 'range', min: 380, max: 1100, step: 1, unit: 'nm' },
  power: { label: 'Puissance', type: 'number', min: 0, max: 1000, step: 0.1, unit: 'mW' },
  pol: { label: 'Polarisation', type: 'select', options: POL_OPTS },
  polAngle: { label: 'Angle de polarisation', type: 'range', min: -90, max: 90, step: 0.5, unit: '°', showIf: p => p.pol === 'angle' },
  spectrum: { label: 'Spectre', type: 'select', options: SPEC_OPTS },
  width: { label: 'Diamètre du faisceau (1/e²)', type: 'number', min: 0.05, max: 50, step: 0.05, unit: 'mm' },
  size: { label: 'Taille', type: 'number', min: 2, max: 400, step: 1, unit: 'mm' },
  theta: { label: 'Angle de l\'axe θ', type: 'range', min: -90, max: 90, step: 0.5, unit: '°' },
};
const DEFS = {
  laser: { cat: 'Sources', name: 'Laser', kind: 'source', color: '#ff5566', params: { lambda: 633, power: 1, pol: 'H', polAngle: 0, spectrum: 'mono', width: 1 }, spec: ['lambda', 'spectrum', 'power', 'pol', 'polAngle', 'width'] },
  collimated: { cat: 'Sources', name: 'Faisceau large', kind: 'source', color: '#ffaa44', params: { lambda: 550, power: 1, pol: 'U', polAngle: 0, spectrum: 'mono', beamWidth: 20, rays: 9 }, spec: ['lambda', 'spectrum', 'power', 'pol', 'polAngle', ['beamWidth', { label: 'Largeur du faisceau', type: 'number', min: 1, max: 200, step: 1, unit: 'mm' }], ['rays', { label: 'Nombre de rayons', type: 'range', min: 2, max: 41, step: 1 }]] },
  point: { cat: 'Sources', name: 'Source ponctuelle', kind: 'source', color: '#ffdd55', params: { lambda: 550, power: 1, pol: 'U', polAngle: 0, spectrum: 'mono', spread: 30, rays: 15 }, spec: ['lambda', 'spectrum', 'power', 'pol', 'polAngle', ['spread', { label: 'Ouverture angulaire', type: 'range', min: 1, max: 360, step: 1, unit: '°' }], ['rays', { label: 'Nombre de rayons', type: 'range', min: 2, max: 61, step: 1 }]] },
  photon: { cat: 'Sources', name: 'Source de photons uniques', kind: 'source', color: '#c38bff', params: { lambda: 810, pol: 'H', polAngle: 0, width: 1 }, spec: ['lambda', 'pol', 'polAngle', 'width'], photon: true },

  mirror: { cat: 'Miroirs & séparateurs', name: 'Miroir plan', kind: 'seg', params: { size: 30 }, spec: ['size'] },
  concave: { cat: 'Miroirs & séparateurs', name: 'Miroir courbe', kind: 'seg', params: { f: 100, size: 40 }, spec: [['f', { label: 'Focale f (négative = convexe)', type: 'number', min: -2000, max: 2000, step: 1, unit: 'mm' }], 'size'] },
  bs: { cat: 'Miroirs & séparateurs', name: 'Lame séparatrice', kind: 'seg', params: { R: 50, size: 30 }, spec: [['R', { label: 'Réflectivité R', type: 'range', min: 0, max: 100, step: 0.5, unit: '%' }], 'size'] },
  pbs: { cat: 'Miroirs & séparateurs', name: 'Cube séparateur polarisant', kind: 'seg', params: { size: 25 }, spec: ['size'] },

  lens: { cat: 'Lentilles & verres', name: 'Lentille mince', kind: 'seg', params: { f: 100, size: 40 }, spec: [['f', { label: 'Focale f (négative = divergente)', type: 'number', min: -2000, max: 2000, step: 1, unit: 'mm' }], 'size'] },
  block: { cat: 'Lentilles & verres', name: 'Bloc de verre', kind: 'glass', params: { w: 30, h: 50, material: 'BK7', n: 1.5, fresnel: true }, spec: [['w', { label: 'Épaisseur', type: 'number', min: 1, max: 300, step: 1, unit: 'mm' }], ['h', { label: 'Hauteur', type: 'number', min: 1, max: 300, step: 1, unit: 'mm' }], ['material', { label: 'Matériau', type: 'select', options: MAT_OPTS }], ['n', { label: 'Indice n', type: 'number', min: 1, max: 4, step: 0.001, showIf: p => p.material === 'custom' }], ['fresnel', { label: 'Réflexions partielles (Fresnel)', type: 'check' }]] },
  prism: { cat: 'Lentilles & verres', name: 'Prisme', kind: 'glass', params: { side: 60, apex: 60, material: 'SF11', n: 1.5, fresnel: false }, spec: [['side', { label: 'Taille', type: 'number', min: 5, max: 300, step: 1, unit: 'mm' }], ['apex', { label: 'Angle au sommet', type: 'range', min: 10, max: 120, step: 1, unit: '°' }], ['material', { label: 'Matériau', type: 'select', options: MAT_OPTS }], ['n', { label: 'Indice n', type: 'number', min: 1, max: 4, step: 0.001, showIf: p => p.material === 'custom' }], ['fresnel', { label: 'Réflexions partielles (Fresnel)', type: 'check' }]] },

  polarizer: { cat: 'Polarisation & phase', name: 'Polariseur', kind: 'seg', params: { theta: 0, size: 25 }, spec: ['theta', 'size'] },
  hwp: { cat: 'Polarisation & phase', name: 'Lame demi-onde λ/2', kind: 'seg', params: { theta: 22.5, size: 25 }, spec: ['theta', 'size'] },
  qwp: { cat: 'Polarisation & phase', name: 'Lame quart d\'onde λ/4', kind: 'seg', params: { theta: 45, size: 25 }, spec: ['theta', 'size'] },
  retarder: { cat: 'Polarisation & phase', name: 'Lame à retard variable', kind: 'seg', params: { theta: 0, delta: 90, size: 25 }, spec: ['theta', ['delta', { label: 'Retard δ', type: 'range', min: 0, max: 360, step: 1, unit: '°' }], 'size'] },
  rotator: { cat: 'Polarisation & phase', name: 'Rotateur (Faraday)', kind: 'seg', params: { theta: 45, size: 25 }, spec: [['theta', { label: 'Rotation', type: 'range', min: -180, max: 180, step: 0.5, unit: '°' }], 'size'] },
  phase: { cat: 'Polarisation & phase', name: 'Déphaseur φ', kind: 'seg', params: { phi: 0, size: 25 }, spec: [['phi', { label: 'Déphasage φ', type: 'range', min: 0, max: 360, step: 1, unit: '°' }], 'size'] },

  filter: { cat: 'Filtres & diffraction', name: 'Filtre passe-bande', kind: 'seg', params: { center: 550, bw: 40, size: 25 }, spec: [['center', { label: 'Centre', type: 'range', min: 380, max: 1100, step: 1, unit: 'nm' }], ['bw', { label: 'Largeur (FWHM)', type: 'range', min: 1, max: 400, step: 1, unit: 'nm' }], 'size'] },
  nd: { cat: 'Filtres & diffraction', name: 'Densité neutre', kind: 'seg', params: { T: 50, size: 25 }, spec: [['T', { label: 'Transmission', type: 'range', min: 0, max: 100, step: 0.1, unit: '%' }], 'size'] },
  iris: { cat: 'Filtres & diffraction', name: 'Diaphragme (iris)', kind: 'seg', params: { aperture: 6, size: 40 }, spec: [['aperture', { label: 'Ouverture', type: 'number', min: 0, max: 400, step: 0.5, unit: 'mm' }], 'size'] },
  slit: { cat: 'Filtres & diffraction', name: 'Fente simple', kind: 'seg', params: { a: 60, size: 30 }, spec: [['a', { label: 'Largeur de fente a', type: 'number', min: 1, max: 2000, step: 1, unit: 'µm' }], 'size'] },
  dslit: { cat: 'Filtres & diffraction', name: 'Fentes d\'Young', kind: 'seg', params: { d: 250, a: 40, size: 30 }, spec: [['d', { label: 'Écart entre fentes d', type: 'number', min: 2, max: 5000, step: 1, unit: 'µm' }], ['a', { label: 'Largeur de fente a', type: 'number', min: 1, max: 2000, step: 1, unit: 'µm' }], 'size'] },
  grating: { cat: 'Filtres & diffraction', name: 'Réseau de diffraction', kind: 'seg', params: { lpm: 600, orders: 2, size: 25 }, spec: [['lpm', { label: 'Traits par mm', type: 'number', min: 1, max: 3600, step: 1 }], ['orders', { label: 'Ordres max ±m', type: 'range', min: 0, max: 5, step: 1 }], 'size'] },
  absorber: { cat: 'Filtres & diffraction', name: 'Absorbeur (beam dump)', kind: 'seg', params: { size: 25 }, spec: ['size'] },

  spad: { cat: 'Capteurs', name: 'Détecteur de photon unique (SPAD)', kind: 'det', color: '#7cf29a', params: { eta: 100, dark: 0, size: 10 }, spec: [['eta', { label: 'Efficacité quantique η', type: 'range', min: 0, max: 100, step: 1, unit: '%' }], ['dark', { label: 'Coups d\'obscurité par tir', type: 'range', min: 0, max: 5, step: 0.01, unit: '%' }], 'size'] },
  power: { cat: 'Capteurs', name: 'Photodiode / puissance-mètre', kind: 'det', color: '#59c3ff', params: { size: 10 }, spec: ['size'] },
  screen: { cat: 'Capteurs', name: 'Écran / caméra CCD', kind: 'det', color: '#ffffff', params: { size: 30, res: 600 }, spec: ['size', ['res', { label: 'Pixels', type: 'range', min: 50, max: 2000, step: 10 }]] },
  spectro: { cat: 'Capteurs', name: 'Spectromètre', kind: 'det', color: '#ffb2f0', params: { size: 15 }, spec: ['size'] },
  polarimeter: { cat: 'Capteurs', name: 'Polarimètre (Stokes)', kind: 'det', color: '#ffe066', params: { size: 10 }, spec: ['size'] },
  probe: { cat: 'Capteurs', name: 'Sonde d\'état quantique (non destructive)', kind: 'probe', color: '#d78cff', params: { mode: 'pol', qname: 'Q1', size: 20 }, spec: [['mode', { label: 'Qubit lu', type: 'select', options: [['pol', 'Polarisation (H/V)'], ['rail0', 'Chemin : rail |0⟩'], ['rail1', 'Chemin : rail |1⟩']] }], ['qname', { label: 'Nom du qubit de chemin', type: 'text', showIf: p => p.mode !== 'pol' }], 'size'] },
};
const DET_TYPES = ['spad', 'power', 'screen', 'spectro', 'polarimeter'];

function compSize(c) { return c.p.size || 30; }
function glassVerts(c) {
  const a = c.angle * D2R, n = [Math.cos(a), Math.sin(a)], t = [-Math.sin(a), Math.cos(a)];
  let loc;
  if (c.type === 'block') { const w = c.p.w / 2, h = c.p.h / 2; loc = [[-w, -h], [w, -h], [w, h], [-w, h]]; }
  else { // triangle isocèle, sommet vers -x local (n), base vers +x
    const s = c.p.side, A = (c.p.apex || 60) * D2R, hb = s * Math.sin(A / 2), H = s * Math.cos(A / 2);
    loc = [[-2 * H / 3, 0], [H / 3, -hb], [H / 3, hb]];
  }
  return loc.map(([x, y]) => [c.x + n[0] * x + t[0] * y, c.y + n[1] * x + t[1] * y]);
}

function buildSurfaces(comps) {
  const S = [];
  for (const c of comps) {
    const d = DEFS[c.type]; if (!d || d.kind === 'source') continue;
    const a = c.angle * D2R, n = [Math.cos(a), Math.sin(a)], t = [-Math.sin(a), Math.cos(a)];

  else if (l < 580) { r = (l - 510) / 70; g = 1; }
  else if (l < 645) { r = 1; g = -(l - 645) / 65; }

function photonSources() { return st.comps.filter(c => c.type === 'photon'); }
function sampleOutcome(src) {
  const outs = []; let tot = 0;
  for (const c of st.comps) {
    if (!DET_TYPES.includes(c.type)) continue;
    const r = st.det[c.id]; if (!r) continue;
    let p = r.probBySrc[src.id] || 0; if (c.type === 'spad') p *= c.p.eta / 100;
    if (p > 0) { outs.push([c, p]); tot += p; }
  }
  const sc = tot > 1 ? 1 / tot : 1;
  let u = Math.random();
  for (const [c, p] of outs) { u -= p * sc; if (u < 0) return c; }
  return null;
}
function registerHit(c, src) {
  st.counts[c.id] = (st.counts[c.id] || 0) + 1; st.detected++;
  if (c.type === 'screen') {
    const r = st.det[c.id], pp = r.probProf[src.id]; if (!pp) return;
    let tot = 0; for (let j = 0; j < pp.length; j++) tot += pp[j];
    let u = Math.random() * tot, j = 0; for (; j < pp.length - 1; j++) { u -= pp[j]; if (u < 0) break; }
    const hs = st.scrHits[c.id] || (st.scrHits[c.id] = new Float64Array(pp.length)); hs[j]++;
    const dots = st.scrDots[c.id] || (st.scrDots[c.id] = []); dots.push([(j + Math.random()) / pp.length, Math.random()]); if (dots.length > 6000) dots.shift();
  }
}
function fire(n, animate) {
  const srcs = photonSources(); if (!srcs.length || !st.sim) { flashMsg(L('Ajoute une « Source de photons uniques » pour le mode quantique.', 'Add a "Single-photon source" for quantum mode.')); return; }
  if (animate && n === 1) {
    if (st.anim) return;
    const src = srcs[Math.floor(Math.random() * srcs.length)];
    const segs = st.sim.segs.filter(s => s.src === src.id), fans = st.sim.fans.filter(f => f.src === src.id);
    let maxL = 0; for (const s of segs) { const L = Math.hypot(s.b[0] - s.a[0], s.b[1] - s.a[1]); maxL = Math.max(maxL, s.s0 + Math.min(L, 900)); }
    st.anim = { t0: performance.now(), src, segs, fans, speed: Math.max(350, maxL / 1.6), maxL, out: sampleOutcome(src) };
    requestAnimationFrame(animLoop); return;
  }

    const src = srcs[Math.floor(Math.random() * srcs.length)];
    st.fired++;
    for (const c of st.comps) if (c.type === 'spad' && c.p.dark > 0 && Math.random() < c.p.dark / 100) st.counts[c.id] = (st.counts[c.id] || 0) + 1;
    const out = sampleOutcome(src);

}
function animLoop() {
  const a = st.anim; if (!a) return;
  const t = (performance.now() - a.t0) / 1000, dist = t * a.speed;
  if (dist > a.maxL + 30) {
    st.fired++;

    st.anim = null; draw(); updateCards(); updateQbar();
    const t1 = performance.now(); const fl = () => { draw(); if (performance.now() - t1 < 450) requestAnimationFrame(fl); }; requestAnimationFrame(fl);
    return;

function drawAnim() {
  const a = st.anim, dist = (performance.now() - a.t0) / 1000 * a.speed;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const s of a.segs) {
    const L = Math.hypot(s.b[0] - s.a[0], s.b[1] - s.a[1]); if (dist < s.s0 || dist > s.s0 + L) continue;
    const f = (dist - s.s0) / L, p = w2s(s.a[0] + (s.b[0] - s.a[0]) * f, s.a[1] + (s.b[1] - s.a[1]) * f);

    comps: [['point', 0, 0, 0, { spread: 24, rays: 15, lambda: 590 }], ['lens', 200, 0, 0, { f: 100, size: 100 }], ['screen', 400, 0, 0, { size: 30, res: 600 }, 'Écran']],
  },
  malus: {
    name: 'Loi de Malus', view: { x: 160, y: 0, s: 2.2 },
    desc: 'Lumière non polarisée → polariseur à 0° (la moitié passe) → polariseur à θ → I = I₀/2·cos²θ. Fais varier l\'angle de P2. La sonde entre P1 et P2 montre l\'état de polarisation. Bonus : glisse une lame λ/4 entre les deux pour voir la polarisation devenir circulaire.',
    comps: [['laser', 0, 0, 0, { pol: 'U', lambda: 633, power: 1 }], ['polarizer', 100, 0, 0, { theta: 0 }, 'P1'], ['polarizer', 200, 0, 0, { theta: 45 }, 'P2'], ['probe', 150, 0, 0, { mode: 'pol' }, 'Sonde'], ['power', 300, 0, 0, {}, 'PD']],
  },
  brewster: {
    name: 'Angle de Brewster et Fresnel', view: { x: 190, y: -40, s: 2 },
    desc: `Lumière non polarisée sur un bloc de BK7 incliné à l\'angle de Brewster (${BREW.toFixed(1)}°) : la composante p (H, dans le plan) n\'est pas du tout réfléchie, donc le faisceau réfléchi est <b>polarisé V</b> (S₁ = −1 sur le polarimètre). Change l\'angle du bloc pour voir la réflexion H réapparaître.`,
    comps: [['laser', 0, 0, 0, { pol: 'U', lambda: 633 }], ['block', 150, 0, BREW, { w: 20, h: 60, material: 'BK7', fresnel: true }, 'Bloc'], ['polarimeter', 179, -110, -66.85, { size: 15 }, 'Réfléchi'], ['polarimeter', 320, 9.4, 0, { size: 15 }, 'Transmis']],
  },
  fabry: {
    name: 'Cavité Fabry-Pérot', view: { x: 150, y: 0, s: 2.4 },
    desc: 'Deux miroirs partiels (R = 90 %) : la lumière fait des dizaines d\'allers-retours, qui interfèrent. Seules certaines phases d\'aller-retour sont transmises (résonances fines). Fais glisser le déphaseur φ entre 0 et 180° : la transmission passe de ≈ 0,3 % à ≈ 86 % (pas 100 % : le faisceau gaussien diverge un peu à chaque aller-retour, comme dans une vraie cavité plan-plan ; essaie un faisceau plus large).',
    comps: [['laser', 0, 0, 0, { lambda: 633 }], ['bs', 100, 0, 0, { R: 90 }, 'M_in'], ['phase', 150, 0, 0, { phi: 132.3 }, 'φ'], ['bs', 200, 0, 0, { R: 90 }, 'M_out'], ['power', 300, 0, 0, {}, 'PD']],
  },
};
function loadPreset(key) {
  const pr = PRESETS[key]; if (!pr) return;
  pushUndo(); st.comps = []; st.nextId = 1; st.sel = null; st.presetKey = key;
  for (const [type, x, y, a, p, label] of pr.comps) { const c = newComp(type, x, y, a, p || {}); if (label) c.label = tr(label); st.comps.push(c); }
  st.view = Object.assign({}, pr.view);
  if (st.cont) toggleCont();
  geomChanged = true; recompute(); fitView(); buildProps(); updateCards(true);
}

// ---------- aide ----------
const HELP_FR = `<h2>Banc d'optique quantique — mode d'emploi</h2>
<p>Une table optique 2D vue de dessus. Tu poses des sources, des composants et des capteurs, tu les relies en chaîne, et le moteur propage la lumière en temps réel.</p>
<h3>Ce que le moteur calcule</h3>
<ul>
<li><b>Optique géométrique</b> : réflexion, réfraction (Snell-Descartes), réflexion totale, lentilles et miroirs courbes, dispersion par la loi de Cauchy (n dépend de λ).</li>
<li><b>Optique ondulatoire</b> : chaque faisceau garde son amplitude complexe et sa phase e^{ikL} le long du chemin optique. Les capteurs additionnent les <b>champs</b> (et pas les intensités) des faisceaux cohérents : franges, Michelson, Fabry-Pérot et Mach-Zehnder sortent tout seuls. Les faisceaux laser sont gaussiens (paramètre q : divergence, focalisation, courbure du front d'onde).</li>
<li><b>Diffraction</b> : les fentes deviennent des rangées de sources de Huygens ; le réseau envoie la lumière dans ses ordres m.</li>
<li><b>Polarisation</b> : calcul de Jones (polariseurs, lames λ/2, λ/4, retard quelconque, rotateur, cube polarisant, coefficients de Fresnel s/p).</li>
<li><b>Quantique (un photon à la fois)</b> : l'amplitude de probabilité suit le même calcul. Quand tu émets un photon, un seul capteur clique, tiré au hasard selon la règle de Born P = |ψ|². Les pertes (absorbeurs, polariseurs, efficacité η des SPAD) sont comptées.</li>
</ul>
<h3>Qubits photoniques</h3>
<table><tr><th>Porte</th><th>Objet</th></tr>
<tr><td>Hadamard H</td><td>Lame λ/2, θ = 22,5°</td></tr><tr><td>X (NOT)</td><td>Lame λ/2, θ = 45°</td></tr><tr><td>Z</td><td>Lame λ/2, θ = 0°</td></tr>
<tr><td>S (phase i)</td><td>Lame λ/4, θ = 0°</td></tr><tr><td>Rotation quelconque</td><td>Lame à retard (θ, δ) ou rotateur</td></tr>
<tr><td>Mesure Z (polarisation)</td><td>Cube polarisant + 2 SPAD</td></tr>
<tr><td>Qubit de chemin</td><td>Séparatrice 50/50 (≈ Hadamard), déphaseur φ (phase), Mach-Zehnder (rotation complète)</td></tr></table>
<p>Codage : polarisation H = |0⟩, V = |1⟩, D = |+⟩, R = |+i⟩. Sur la sphère de Bloch, z = H/V, x = D/A, y = R/L. La <b>sonde d'état</b> lit l'état sans le perturber (c'est un outil de simulation, ça n'existe pas en vrai). Deux sondes « rail 0 » et « rail 1 » du même nom lisent un qubit de chemin, avec sa cohérence (|r| &lt; 1 si le qubit est intriqué avec autre chose).</p>
<h3>Capteurs</h3>
<p>Photodiode (puissance, flux de photons), SPAD (clics, efficacité, coups d'obscurité), écran/caméra (profil d'intensité et accumulation d'impacts), spectromètre, polarimètre (Stokes, ellipse, sphère de Poincaré), sonde d'état quantique.</p>
<h3>Limites honnêtes</h3>
<ul><li>Table en 2D ; l'optique est paraxiale pour les lentilles (pas d'aberrations).</li>
<li>Un seul photon à la fois : pas encore de paires intriquées (SPDC), de Hong-Ou-Mandel ni de coïncidences à deux photons.</li>
<li>La lumière diffractée par une fente n'est pas re-focalisée par une lentille placée après (elle va directement aux capteurs).</li>
<li>Pas de matière « quantique » (atomes, niveaux d'énergie, absorption résonante) : les matériaux sont décrits par leur indice et leur transmission.</li></ul>
<h3>Commandes</h3>
<p>Molette = zoom · glisser le fond = se déplacer · glisser un objet = le déplacer · poignée ↻ = tourner (Maj : sans aimant) · <kbd>R</kbd>/<kbd>E</kbd> ±15° · <kbd>Suppr</kbd> · <kbd>Ctrl+D</kbd> · <kbd>Ctrl+Z</kbd> · <kbd>Espace</kbd> = 1 photon. Le montage est enregistré automatiquement dans ton navigateur ; utilise Exporter/Importer pour le garder dans un fichier.</p>
<div class="btns"><button onclick="document.getElementById('mHelp').classList.remove('show')">Fermer</button></div>`;

// ---------- boutons ----------
const sel = $('preset');
function fillPresets() { sel.innerHTML = ''; const o0 = document.createElement('option'); o0.value = ''; o0.textContent = L('📚 Expériences…', '📚 Experiments…'); sel.appendChild(o0); for (const [k, p] of Object.entries(PRESETS)) { const o = document.createElement('option'); o.value = k; o.textContent = LANG === 'en' ? PRESETS_EN[k][0] : p.name; sel.appendChild(o); } }
fillPresets();
sel.onchange = () => { if (sel.value) loadPreset(sel.value); sel.value = ''; };
$('bNew').onclick = () => { pushUndo(); st.comps = []; st.sel = null; st.presetKey = ''; changed(); buildProps(); };
$('bUndo').onclick = undo;
$('bSnap').onclick = e => { st.snap = !st.snap; e.target.classList.toggle('on', st.snap); };
$('bRays').onclick = e => { st.showRays = !st.showRays; e.target.classList.toggle('on', st.showRays); draw(); };
function fitView() {
  if (!st.comps.length) return; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const c of st.comps) { x0 = Math.min(x0, c.x); y0 = Math.min(y0, c.y); x1 = Math.max(x1, c.x); y1 = Math.max(y1, c.y); }
  st.view.x = (x0 + x1) / 2; st.view.y = (y0 + y1) / 2; st.view.s = Math.max(0.2, Math.min(8, Math.min(W / (x1 - x0 + 140), H / (y1 - y0 + 110)))); draw(); save();
}
$('bFit').onclick = fitView;
$('bHelp').onclick = () => $('mHelp').classList.add('show');
$('mHelp').onclick = e => { if (e.target.id === 'mHelp') e.target.classList.remove('show'); };
function openIO(exp) {
  $('mIO').classList.add('show'); $('ioTitle').textContent = exp ? L('Exporter le montage', 'Export setup') : L('Importer un montage', 'Import a setup');
  $('ioHint').textContent = exp ? L('Copie ce texte et garde-le dans un fichier .json.', 'Copy this text and keep it in a .json file.') : L('Colle un montage exporté, ou ouvre un fichier .json.', 'Paste an exported setup, or open a .json file.');
  $('ioText').value = exp ? JSON.stringify({ format: 'banc-optique-1', comps: st.comps }, null, 1) : '';
  $('ioLoad').style.display = exp ? 'none' : ''; $('ioFileBtn').style.display = exp ? 'none' : ''; $('ioCopy').style.display = exp ? '' : 'none';
}
$('bExport').onclick = () => openIO(true); $('bImport').onclick = () => openIO(false);
$('ioClose').onclick = () => $('mIO').classList.remove('show');
$('ioCopy').onclick = async () => { try { await navigator.clipboard.writeText($('ioText').value); $('ioCopy').textContent = L('Copié ✓', 'Copied ✓'); } catch (e) { $('ioText').select(); $('ioCopy').textContent = L('Sélectionné : Ctrl+C', 'Selected: Ctrl+C'); } setTimeout(() => $('ioCopy').textContent = L('Copier', 'Copy'), 1800); };
$('ioFileBtn').onclick = () => $('ioFile').click();
$('ioFile').onchange = async e => { const f = e.target.files[0]; if (f) $('ioText').value = await f.text(); };
$('ioLoad').onclick = () => {
  try {
    const o = JSON.parse($('ioText').value); if (!Array.isArray(o.comps)) throw 0;
    pushUndo(); st.comps = o.comps.filter(c => DEFS[c.type]).map(c => ({ ...c, p: Object.assign({}, DEFS[c.type].params, c.p) }));
    st.nextId = 1 + Math.max(0, ...st.comps.map(c => +String(c.id).replace(/\D/g, '') || 0)); st.sel = null; st.presetKey = '';
    $('mIO').classList.remove('show'); changed(); buildProps(); fitView();
  } catch (e) { $('ioHint').textContent = L('⚠ Ce texte n\'est pas un montage valide.', '⚠ This text is not a valid setup.'); }
};

// ---------- langue ----------
const HDR = { bNew: ['Nouveau', 'New', 'Vider la table', 'Clear the table'], bUndo: ['↶ Annuler', '↶ Undo', 'Annuler (Ctrl+Z)', 'Undo (Ctrl+Z)'], bSnap: ['Aimant', 'Snap', 'Aimanter à la grille (positions 5 mm, angles 5°)', 'Snap to grid (5 mm positions, 5° angles)'], bRays: ['Rayons', 'Rays', 'Afficher les faisceaux', 'Show beams'], bFit: ['⤢ Vue', '⤢ Fit', 'Recentrer la vue', 'Fit view'], bExport: ['Exporter', 'Export', '', ''], bImport: ['Importer', 'Import', '', ''], bHelp: ['? Aide', '? Help', '', ''], ioCopy: ['Copier', 'Copy', '', ''], ioFileBtn: ['Ouvrir un fichier…', 'Open a file…', '', ''], ioLoad: ['Charger ce montage', 'Load this setup', '', ''], ioClose: ['Fermer', 'Close', '', ''] };
function applyLang() {
  document.documentElement.lang = LANG;
  for (const [id, t] of Object.entries(HDR)) { const e = $(id); if (!e) continue; e.textContent = L(t[0], t[1]); if (t[2]) e.title = L(t[2], t[3]); }
  $('hTitle').innerHTML = L("Banc d'optique <span>quantique</span>", 'Quantum <span>optics</span> bench');
  document.title = L("Banc d'optique quantique", 'Quantum optics bench');
  $('preset').title = L('Charger une expérience', 'Load an experiment');
  $('lFR').classList.toggle('on', LANG === 'fr'); $('lEN').classList.toggle('on', LANG === 'en');
  $('helpBox').innerHTML = LANG === 'en' ? HELP_EN : HELP_FR;
  fillPresets(); buildPalette(); buildProps(); qbarSig = ''; updateQbar(); updateCards(true); draw();
}
function setLang(l) {
  if (l === LANG) return; LANG = l; try { localStorage.setItem('banc-optique-lang', l); } catch (e) { }
  // renomme les étiquettes par défaut (ex. Écran1 ↔ Screen1, Sonde ↔ Probe)
  const inv = {}; for (const [fr, en] of Object.entries(EN)) inv[en] = fr;
  for (const c of st.comps) {
    const m = c.label.match(/^(.*?)(\d*)$/), base = m[1], num = m[2];
    const pf = PREFIX[c.type], pe = PREFIX_EN[c.type];
    if (l === 'en' && base === pf) c.label = pe + num; else if (l === 'fr' && base === pe) c.label = pf + num;
    else if (l === 'en' && EN[c.label] && EN[c.label] !== c.label && !DEFS[c.label]) c.label = EN[c.label];
    else if (l === 'fr' && inv[c.label] && inv[c.label] !== c.label) c.label = inv[c.label];
  }
  applyLang(); save();
}
$('lFR').onclick = () => setLang('fr'); $('lEN').onclick = () => setLang('en');

// ---------- démarrage ----------
buildPalette();
window.addEventListener('resize', () => { resize(); updateCards(true); });
new ResizeObserver(() => resize()).observe($('stage'));
resize();
let restored = false;
try {
  const s = JSON.parse(localStorage.getItem('banc-optique-v1') || 'null');
  if (s && Array.isArray(s.comps) && s.comps.length) { st.comps = s.comps.filter(c => DEFS[c.type]).map(c => ({ ...c, p: Object.assign({}, DEFS[c.type].params, c.p) })); st.nextId = s.nextId || 100; if (s.view) st.view = s.view; st.presetKey = s.preset || ''; restored = true; }
} catch (e) { }
if (restored) { geomChanged = true; recompute(); buildProps(); } else loadPreset('mzi');
applyLang();

</script>
</body>
